# Isolated database for automated tests - never points at a dev or prod database.
# ddl-auto=create-drop gives each test run a fresh schema and drops it afterward.
spring.datasource.url=jdbc:postgresql://localhost:5432/groupmart_cwp_test
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

app.seed-data=false

app.jwt.secret=Y2hhdmVTZWNyZXRFeGFtcGxlQDEyMzQ1Njc4OTBxMjM0NTY3ODkwQHF1ZXN0aW9u
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:5173

logging.level.com.groupmart=INFO
logging.level.org.hibernate.SQL=WARN
