# GroupMart AI - Development Profile (PostgreSQL)

app.seed-data=true

# Database Configuration - Your groupmart_new database
spring.datasource.url=jdbc:postgresql://localhost:5432/groupmart_new
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:Y2hhdmVTZWNyZXRFeGFtcGxlQDEyMzQ1Njc4OTBxMjM0NTY3ODkwQHF1ZXN0aW9u}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.groupmart=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
