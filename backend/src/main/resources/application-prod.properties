# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Railway PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexuscommerce_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexus_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nexus_secure_password_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA & Hibernate Production Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Security JWT Configuration
jwt.secret=${JWT_SECRET:ProductionJwtSecretKeyForNexusCommerceEnterpriseAi2026Secure256Bit}
jwt.expiration-ms=86400000

# CORS Allowed Origins for Vercel Deployment
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://groupmart-frontend.vercel.app}

# OpenAI & AI Assistant Configurations
openai.api.key=${OPENAI_API_KEY:}
openai.model=${AI_MODEL:gpt-3.5-turbo}

# Spring Boot Actuator Endpoints & Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

# Logging Configurations
logging.level.root=INFO
logging.level.com.groupmart=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
