# Active Spring Environment Profile Switcher
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application Metadata
spring.application.name=groupmart-backend

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAI & AI Assistant Configurations
openai.api.key=${OPENAI_API_KEY:}
openai.model=${AI_MODEL:gpt-3.5-turbo}

# Spring Boot Actuator Endpoints & Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always